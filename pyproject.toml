[project]
name = "moatlens"
version = "0.6.1"
description = "Single-user value-investing audit tool (Buffett/Munger/Marks/Graham)."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Ray" }]
# Runtime deps listed in requirements.txt; dev deps in requirements-dev.txt.
# Not shipped as a package — this [project] section exists so `pip install .`,
# `uv sync`, and IDE resolvers behave correctly.

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".git", "__pycache__", ".venv", "venv", "data", "docs", "prompts"]

[tool.ruff.lint]
# Keep it lean — style only, not opinionated.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (unused imports, undefined names)
    "W",    # pycodestyle warnings
    "I",    # isort (import order)
    "B",    # bugbear (common bug patterns)
    "UP",   # pyupgrade (modernize syntax)
]
ignore = [
    "E501",   # line too long — handled by formatter, warnings too noisy
    "B008",   # function call in default arg — FastAPI uses Depends() as default
    "B904",   # "raise from" — we don't always need the chain
    "UP042",  # allow the (str, Enum) idiom — not migrating to StrEnum
              # (would change str(member) output; opinionated, not a bug)
]

[tool.ruff.lint.isort]
known-first-party = ["engine", "cli", "web", "shared"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
