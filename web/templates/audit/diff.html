{% extends "base.html" %}
{% block title %}{{ ticker }} 差异 — Moatlens{% endblock %}
{% block content %}

<section class="reveal reveal-1" style="display:flex; justify-content:space-between; align-items:flex-start; gap:var(--s-4); margin-bottom:var(--s-6); flex-wrap:wrap;">
    <div>
        <h1 style="font-family:var(--font-display); font-size:clamp(1.5rem, 3vw, 2.25rem); font-weight:700; letter-spacing:-0.025em; color:var(--fg);">
            {{ ticker }} <span style="font-style:italic; color:var(--fg-2); font-weight:500;">— thesis 演化</span>
        </h1>
        <p style="font-family:var(--font-mono); font-size:var(--t-meta); color:var(--fg-3); margin-top:var(--s-2);">
            <span>{{ previous_date }}</span>
            <span style="margin:0 var(--s-3); color:var(--fg-3);">→</span>
            <span style="color:var(--brand);">{{ current_date }}</span>
        </p>
    </div>
    <a href="/audit/{{ ticker }}/{{ current_date }}" style="font-size:var(--t-meta); color:var(--fg-2); transition:color 200ms ease;" onmouseover="this.style.color='var(--brand)'" onmouseout="this.style.color='var(--fg-2)'">
        最新报告 →
    </a>
</section>

<div class="reveal reveal-2 prose-audit">
    {{ diff_html | safe }}
</div>

<div style="margin-top:var(--s-6); font-size:var(--t-meta); color:var(--fg-3); font-style:italic;">
    用这个视图检查：之前的 thesis 还成立吗？护城河真的弱化了吗？之前列的失败模式是否正在浮现？
</div>

{% endblock %}
